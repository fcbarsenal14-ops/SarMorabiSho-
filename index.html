<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سرمربی شو</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #0b0f0d);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 35px 22px;
            border-radius: 28px;
            background: var(--tg-theme-secondary-bg-color, #151b18);
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 27px;
        }

        .welcome {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .username {
            opacity: 0.7;
            font-size: 15px;
            margin-bottom: 28px;
        }

        button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 16px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">⚽</div>

        <h1>سرمربی شو</h1>

        <div class="welcome">
            سلام به سرمربی شو خوش اومدی 👋
        </div>

        <div class="username" id="username">
            در حال دریافت اطلاعات...
        </div>

        <button onclick="startApp()">
            🚀 شروع بازی
        </button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (user) {
            let fullName = user.first_name || "";

            if (user.last_name) {
                fullName += " " + user.last_name;
            }

            document.getElementById("username").innerText =
                `خوش اومدی ${fullName} 🌟`;
        } else {
            document.getElementById("username").innerText =
                "به بازی سرمربی شو خوش اومدی 🌟";
        }

        function startApp() {
            tg.showAlert("به سرمربی شو خوش اومدی ⚽🔥");
        }
    </script>

</body>
</html>
